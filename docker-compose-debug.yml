name: hello_world_debug

services:

  hello_world_debug:
    build:
      context: hello-world
      dockerfile: Dockerfile
    image: phaustin/hello_world_debug:2025
    labels:
      - traefik.enable=true
      - traefik.http.routers.hello_world_debug.rule=Host(`dashboard.eoas.ubc.ca`) && PathPrefix(`/hello25`)
      - traefik.http.routers.hello_world_debug.tls=true
      - traefik.http.routers.hello_world_debug.service=hello_world_debug
      - traefik.http.services.hello_world_debug.loadbalancer.server.port=8050
      - traefik.http.routers.hello_world_debug.middlewares=hello_world_debug-stripprefix
      - traefik.http.middlewares.hello_world_debug-stripprefix.stripprefix.forceSlash=true
      - traefik.http.middlewares.hello_world_debug-stripprefix.stripprefix.prefixes=/hello25
    container_name: hello_world_debug
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - proxy_aug07
    working_dir: /home/jovyan/dashdir
    command: gunicorn --workers=10 --threads=2 -b 0.0.0.0:8050 app:server


networks:
  proxy_aug07:
    external: true
